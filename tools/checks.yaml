# checks.yaml -- quantitative claim checks for the MaestroRAG IISWC 2026 camera-ready.
#
# Consumed by tools/verify_numbers.py.  Every entry states, explicitly:
#   claimed      what the PAPER prints (or, for figure-only values, what the figure shows)
#   locations    where in the .tex that literal lives ("file:line"); [] means figure-only
#   source       which WORKBOOK cells back it, and how they combine
#   tolerance    how far claimed may sit from the workbook-derived value
#   expect       the status this check is KNOWN to have today
#
# `expect` is the regression anchor.  When the observed status differs from `expect`,
# the script reports DRIFT and (with --strict) exits non-zero.  A check whose expect is
# FAIL is a known, unfixed defect awaiting its own task -- not something to silently
# repair here.
#
# Cell references are 1-based A1 notation into the named sheet.

workbook: data/MaestroRAGResults.xlsx

tabs:
  # The ONLY tabs verify_numbers.py is permitted to read.
  allowed: ["Motivation", "Breakdown", "PowerComp", "mainLatencyResults", "Mapping", "ThroughputResult", "LatencyResults-NoCache4090", "LatencyResults-NoCache4080", "LatencyResults-NoCacheJetson", "edge vs. server"]
  # Known-stale tabs.  Never read for evidence.  If a paper literal matches a value that
  # appears ONLY in one of these, the script raises a stale-source warning.
  stale: ["Encode", "Retrieval", "Comparison"]
  # Present in the workbook but outside the authorised set; neither read nor scanned.
  unlisted: ["CachingResults4090"]

# The .tex files reached from main.tex.  Numeric-literal extraction runs over these only.
tex_sources: ["abstract.tex", "introduction.tex", "background&motivation.tex", "characterization.tex", "design.tex", "implementation&eval.tex", "related_work.tex", "conclusion.tex", "TablesAlgos/CachingTable.tex"]

