    tolerance: 0.0
    expect: PASS
    source:
      file: TablesAlgos/CachingTable.tex
      regex: 'Exact\s*&[^&]*&[^&]*&[^&]*&\s*([0-9.]+)s'
      note: "Exact row, MR column, 4 mil"

